[project]
name = "faultloc"
version = "0.1.0"
description = "Fault localization from issue reports, measured as a ladder of baselines"
readme = "README.md"
authors = [{ name = "Chiajung Wang" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "pydantic>=2.9",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
# Rung 2 and the index command. Kept optional so rung 1 stays installable
# without torch, which is two orders of magnitude larger than everything else
# in the dependency tree.
embed = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]
# Rung 4, the agent. Optional for the same reason `embed` is: rungs 1 through 3
# need none of it. Rung 3 calls OpenRouter through `llm.py`, which is
# hand-rolled `urllib`, so the ladder up to and including the LLM reranker
# installs without a framework.
#
# ADR-0005 requires the dependency stays pinned, because framework version churn
# is a maintenance risk. The floors here are the versions a probe confirmed on
# 2026-08-07, and `uv.lock` carries the exact resolution.
agent = [
    "langgraph>=1.2.10",
    "langchain-openrouter>=0.2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
faultloc = "faultloc.cli:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Docstrings in this repo carry the reasoning behind decisions and sometimes
# include code; format it like real code rather than letting it drift.
docstring-code-format = true
# Keep the magic trailing comma meaningful: a collection written across lines
# with a trailing comma stays expanded. Test parameter lists read better that
# way, and diffs stay one-item-per-line.
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
