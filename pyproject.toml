[project]
name = "faultloc"
version = "0.1.0"
description = "Fault localization from issue reports, measured as a ladder of baselines"
readme = "README.md"
authors = [{ name = "Chiajung Wang" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "pydantic>=2.9",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
faultloc = "faultloc.cli:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
